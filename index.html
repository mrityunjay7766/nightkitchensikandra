<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night Kitchen Sikandra | Order Food Online</title>

<!-- Canonical URL -->
<link rel="canonical" href="https://nightkitchensikandra.netlify.app/">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap">

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0d0d0d, #1a1a1a);
  color: white;
  padding-bottom: 85px;
}

/* Header */
.header-container {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
  background: #0d0d0d;
  border-bottom: 1px solid #222;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-container h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.6em;
  color: #00ffff;
  margin: 0;
  letter-spacing: 2px;
}

.auth-header-btn {
  background: #1a1a1a;
  color: #00ffff;
  border: 1px solid #00ffff;
  padding: 8px 16px;
  border-radius: 20px;
  cursor: pointer;
  font-weight: bold;
  font-size: 13px;
  transition: 0.2s;
}

.auth-header-btn:hover {
  background: #00ffff;
  color: #000;
}

/* Search */
.search-container {
  text-align: center;
  padding: 14px 16px 6px;
}
.search-container input {
  width: 100%;
  max-width: 600px;
  padding: 12px 18px;
  border-radius: 25px;
  border: 2px solid #00ffff;
  background: #1a1a1a;
  color: #00ffff;
  font-size: 15px;
}

/* Category Filter */
.category-container {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 10px 16px;
  background: #111;
  position: sticky;
  top: 68px;
  z-index: 90;
}
.category-container::-webkit-scrollbar { display: none; }

.cat-btn {
  background: #222;
  color: #fff;
  border: 1px solid #333;
  padding: 8px 18px;
  border-radius: 20px;
  cursor: pointer;
  white-space: nowrap;
}
.cat-btn.active { background: #00ffff; color: #000; font-weight: bold; }

/* Menu */
.menu {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
  padding: 20px;
}

.food-card {
  background: #191919;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid #282828;
  display: flex;
  flex-direction: column;
}

.food-card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.card-body {
  padding: 14px;
  display: flex;
  flex-direction: column;
  flex-grow: 1;
  justify-content: space-between;
}

.card-body h3 {
  margin: 0 0 6px 0;
  color: #00ffff;
  font-size: 17px;
}

.card-body .price {
  font-size: 16px;
  color: #00ff00;
  font-weight: bold;
  margin-bottom: 10px;
}

.order-btn {
  background: #00ffff;
  color: #000;
  border: none;
  width: 100%;
  padding: 11px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.size-dropdown {
  width: 100%;
  padding: 8px;
  margin-bottom: 10px;
  border-radius: 6px;
  border: 1px solid #ffcc00;
  background: #fff;
  color: #000;
}

/* Floating Bottom Bar */
.bottom-bar {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%) translateY(120px);
  width: calc(100% - 24px);
  max-width: 500px;
  background: #00ffff;
  color: #000;
  padding: 14px 20px;
  border-radius: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
  z-index: 1000;
  box-shadow: 0 4px 20px rgba(0, 255, 255, 0.4);
}
.bottom-bar.show { transform: translateX(-50%) translateY(0); }

/* Modals */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.8);
  z-index: 2000;
  justify-content: center;
  align-items: center;
  padding: 15px;
}
.modal-overlay.open { display: flex; }

.modal-box {
  background: #141414;
  border: 2px solid #00ffff;
  border-radius: 16px;
  width: 100%;
  max-width: 420px;
  padding: 22px;
  max-height: 90vh;
  overflow-y: auto;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.modal-header h3 { margin: 0; color: #00ffff; }
.close-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }

.form-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.form-group input {
  background: #222;
  border: 1px solid #444;
  color: #fff;
  padding: 12px;
  border-radius: 8px;
  font-size: 14px;
}
.form-group input:focus { outline: none; border-color: #00ffff; }

.link-btn {
  color: #00ffff;
  font-size: 13px;
  text-decoration: underline;
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
  margin-top: 4px;
  text-align: right;
}

.google-auth-btn {
  background: #ffffff;
  color: #333333;
  border: none;
  width: 100%;
  padding: 11px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 14px;
  transition: 0.2s;
}
.google-auth-btn:hover {
  background: #f1f1f1;
}

.history-item {
  background: #1e1e1e;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 10px;
  border: 1px solid #333;
}

.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(30px);
  background: #00ffff;
  color: #000;
  padding: 10px 20px;
  border-radius: 30px;
  font-weight: bold;
  font-size: 14px;
  z-index: 2500;
  opacity: 0;
  transition: 0.3s;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="header-container">
  <h1>NIGHT KITCHEN</h1>
  <button class="auth-header-btn" id="authBtn" onclick="handleAuthHeaderClick()">Login</button>
</div>

<div class="search-container">
  <input type="text" id="menuSearch" onkeyup="filterMenu()" placeholder="Search food items...">
</div>

<div class="category-container">
  <button class="cat-btn active" onclick="filterCategory('all', this)">All</button>
  <button class="cat-btn" onclick="filterCategory('pizza', this)">Pizzas</button>
  <button class="cat-btn" onclick="filterCategory('chinese', this)">Chinese</button>
  <button class="cat-btn" onclick="filterCategory('rolls', this)">Rolls & Snacks</button>
  <button class="cat-btn" onclick="filterCategory('biryani', this)">Biryani</button>
</div>

<section class="menu">
  <!-- Butter Sandwich -->
  <div class="food-card" data-category="rolls">
    <img src="https://i.postimg.cc/HxL3wVkt/sndwith.avif" alt="Butter Sandwich" loading="lazy">
    <div class="card-body">
      <h3>Butter Sandwich</h3>
      <div class="price">₹79</div>
      <button class="order-btn" onclick="addToCart('Butter Sandwich', 79)">Add to Cart</button>
    </div>
  </div>

  <!-- Corn Pizza -->
  <div class="food-card" data-category="pizza">
    <img src="https://i.postimg.cc/rpMTrTx4/Screenshot-2026-04-14-141443.png" alt="Corn Pizza" loading="lazy">
    <div class="card-body">
      <h3>Corn Pizza</h3>
      <select class="size-dropdown" data-name="Corn Pizza" onchange="updatePizzaPrice(this)">
        <option value="139" data-size="Regular">Regular - ₹139</option>
        <option value="220" data-size="Medium">Medium - ₹220</option>
        <option value="290" data-size="Large">Large - ₹290</option>
      </select>
      <div class="price">₹139</div>
      <button class="order-btn cart-btn" onclick="addToCart('Corn Pizza (Regular)', 139)">Add to Cart</button>
    </div>
  </div>

  <!-- Kurkure Momos -->
  <div class="food-card" data-category="rolls">
    <img src="https://i.postimg.cc/2S42KhT2/09.jpg" alt="Kurkure Momos" loading="lazy">
    <div class="card-body">
      <h3>Kurkure Momos</h3>
      <div class="price">₹60 (6 Pcs)</div>
      <button class="order-btn" onclick="addToCart('Kurkure Momos (6 Pcs)', 60)">Add to Cart</button>
    </div>
  </div>

  <!-- Paneer Chowmein -->
  <div class="food-card" data-category="chinese">
    <img src="https://cdn.postimage.me/2026/07/19/paneer-chowmin.jpg" alt="Paneer Chowmein" loading="lazy">
    <div class="card-body">
      <h3>Paneer Chowmein</h3>
      <select class="size-dropdown" data-name="Paneer Chowmein" onchange="updatePizzaPrice(this)">
        <option value="100" data-size="Half">Half Plate - ₹100</option>
        <option value="180" data-size="Full">Full Plate - ₹180</option>
      </select>
      <div class="price">₹100</div>
      <button class="order-btn cart-btn" onclick="addToCart('Paneer Chowmein (Half)', 100)">Add to Cart</button>
    </div>
  </div>

  <!-- Chicken Biryani -->
  <div class="food-card" data-category="biryani">
    <img src="https://i.postimg.cc/SsMzqswv/Chicken-Biryani-Recipe.jpg" alt="Chicken Biryani" loading="lazy">
    <div class="card-body">
      <h3>Chicken Biryani</h3>
      <div class="price">₹250</div>
      <button class="order-btn" onclick="addToCart('Chicken Biryani (Full Plate)', 250)">Add to Cart</button>
    </div>
  </div>
</section>

<!-- Floating Cart Bar -->
<div class="bottom-bar" id="cartBar" onclick="openModal('cartModal')">
  <span id="barCount">0 ITEMS | ₹0</span>
  <span>View Cart & Order ➔</span>
</div>

<!-- Cart Modal -->
<div class="modal-overlay" id="cartModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Your Food Cart</h3>
      <button class="close-btn" onclick="closeModal('cartModal')">&times;</button>
    </div>
    <div id="cartItemsList" style="margin-bottom: 15px;"></div>
    <div class="form-group">
      <input type="text" id="deliveryAddress" placeholder="Delivery Address / Ward / Landmark" required>
      <div style="display:flex; justify-content:space-between; font-weight:bold; margin-top:8px;">
        <span>Total:</span>
        <span style="color:#00ff00;">₹<span id="cartGrandTotal">0</span></span>
      </div>
      <button class="order-btn" style="background:#25D366; color:#fff; margin-top:8px;" onclick="placeOrder()">
        Confirm Order via WhatsApp
      </button>
    </div>
  </div>
</div>

<!-- Auth Modal (Google Sign-In + Phone/Password) -->
<div class="modal-overlay" id="authModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="authTitle">Login</h3>
      <button class="close-btn" onclick="closeModal('authModal')">&times;</button>
    </div>
    <div class="form-group">
      <!-- 1-Click Google Sign-In Button -->
      <button type="button" class="google-auth-btn" onclick="signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <div style="display:flex; align-items:center; margin:8px 0;">
        <hr style="flex:1; border:none; border-top:1px solid #333;">
        <span style="padding:0 10px; color:#777; font-size:12px;">OR LOGIN WITH PHONE</span>
        <hr style="flex:1; border:none; border-top:1px solid #333;">
      </div>

      <input type="text" id="authName" placeholder="Aapka Naam (Full Name)" style="display:none;">
      <input type="tel" id="authPhone" placeholder="Mobile Number (10 digits)" maxlength="10">
      <input type="password" id="authPass" placeholder="Password">
      <button class="link-btn" id="forgotPassLink" onclick="triggerWhatsAppPasswordReset()">Forgot Password?</button>
      <button class="order-btn" id="authSubmitBtn" onclick="processAuthSubmit()">Sign In</button>
      
      <div style="text-align:center; font-size:13px; color:#aaa; margin-top:8px;">
        <span id="toggleAuthPrompt">New to Night Kitchen?</span>
        <button class="link-btn" style="display:inline; margin:0;" onclick="toggleAuthMode()" id="toggleAuthAction">Create Account</button>
      </div>
    </div>
  </div>
</div>

<!-- Order History Modal -->
<div class="modal-overlay" id="historyModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Previous Orders</h3>
      <button class="close-btn" onclick="closeModal('historyModal')">&times;</button>
    </div>
    <div id="historyListContainer">Loading your orders...</div>
    <button class="order-btn" style="background:#ff4444; color:#fff; margin-top:15px;" onclick="handleLogout()">
      Logout
    </button>
  </div>
</div>

<script>
/* =========================================================
   1. CREDENTIALS & INITIALIZATION (LIVE KEYS)
========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBWW71dNw8EYwDvNn9J3PDUsXkwvoz-3_g",
  authDomain: "nightkitchenorders-bd0eb.firebaseapp.com",
  projectId: "nightkitchenorders-bd0eb",
  storageBucket: "nightkitchenorders-bd0eb.firebasestorage.app",
  messagingSenderId: "536153646146",
  appId: "1:536153646146:web:37a26ad9106cd34271f9db",
  measurementId: "G-V0QV5LB4B7"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const SUPABASE_URL = "https://vumdefdhnmvivncaebgd.supabase.co";
const SUPABASE_KEY = "sb_publishable_3Nh8y6OCGmm-PjGNxc4y1w_TcH8i93A";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* =========================================================
   2. SESSION & AUTH LOGIC
========================================================= */
let isSignUpMode = false;
let currentUser = JSON.parse(localStorage.getItem("nk_user")) || null;

function renderUserHeader() {
  const btn = document.getElementById("authBtn");
  btn.textContent = currentUser ? `👤 ${currentUser.name.split(" ")[0]}` : "Login";
}
renderUserHeader();

function handleAuthHeaderClick() {
  if (currentUser) {
    fetchOrderHistory();
    openModal('historyModal');
  } else {
    openModal('authModal');
  }
}

function toggleAuthMode() {
  isSignUpMode = !isSignUpMode;
  document.getElementById("authName").style.display = isSignUpMode ? "block" : "none";
  document.getElementById("authTitle").textContent = isSignUpMode ? "Create Account" : "Login";
  document.getElementById("authSubmitBtn").textContent = isSignUpMode ? "Sign Up" : "Sign In";
  document.getElementById("forgotPassLink").style.display = isSignUpMode ? "none" : "block";
  document.getElementById("toggleAuthPrompt").textContent = isSignUpMode ? "Already have an account?" : "New to Night Kitchen?";
  document.getElementById("toggleAuthAction").textContent = isSignUpMode ? "Login" : "Create Account";
}

/* 1-Click Google Sign-In (100% Free Lifetime) */
async function signInWithGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  try {
    const result = await firebase.auth().signInWithPopup(provider);
    const user = result.user;
    
    currentUser = {
      name: user.displayName || "Customer",
      phone: user.phoneNumber || user.email,
      email: user.email || ""
    };

    if (supabaseClient) {
      await supabaseClient.from('customers').upsert([{
        phone: currentUser.phone,
        name: currentUser.name
      }], { onConflict: 'phone' });
    }

    localStorage.setItem("nk_user", JSON.stringify(currentUser));
    renderUserHeader();
    closeModal('authModal');
    showToast("Welcome " + currentUser.name + "!");
  } catch (error) {
    console.error("Google Auth Error:", error);
    alert("Google Sign-In Error: " + error.message);
  }
}

async function processAuthSubmit() {
  const phone = document.getElementById("authPhone").value.trim();
  const pass = document.getElementById("authPass").value.trim();
  const name = document.getElementById("authName").value.trim();

  if (!phone || phone.length !== 10 || !pass) {
    alert("Kripya 10-digit mobile number aur password dalein.");
    return;
  }

  if (isSignUpMode) {
    if (!name) {
      alert("Kripya apna naam dalein.");
      return;
    }
    const { error } = await supabaseClient.from('customers').insert([{ phone, name, password: pass }]);
    if (error) {
      alert(error.message.includes("duplicate") ? "Yeh number pehle se registered hai." : error.message);
      return;
    }
    currentUser = { phone, name };
  } else {
    const { data, error } = await supabaseClient
      .from('customers')
      .select('phone, name')
      .eq('phone', phone)
      .eq('password', pass)
      .single();

    if (error || !data) {
      alert("Galat phone number ya password!");
      return;
    }
    currentUser = { phone: data.phone, name: data.name };
  }

  localStorage.setItem("nk_user", JSON.stringify(currentUser));
  renderUserHeader();
  closeModal('authModal');
  showToast("Welcome " + currentUser.name + "!");
}

function triggerWhatsAppPasswordReset() {
  const phone = document.getElementById("authPhone").value.trim();
  const promptText = phone ? `mera mobile number ${phone} hai` : "mera account password reset karna hai";
  const msg = `Hello Night Kitchen, mujhe apna password reset karna hai, ${promptText}. Kripya madad karein.`;
  window.open(`https://wa.me/917061632122?text=${encodeURIComponent(msg)}`, "_blank");
}

function handleLogout() {
  localStorage.removeItem("nk_user");
  currentUser = null;
  renderUserHeader();
  closeModal('historyModal');
  showToast("Logged out successfully");
}

/* =========================================================
   3. CART & ORDER ACTIONS
========================================================= */
let cart = [];

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function addToCart(name, price) {
  const item = cart.find(i => i.name === name);
  if (item) item.qty++;
  else cart.push({ name, price: Number(price), qty: 1 });
  showToast(`Added: ${name}`);
  updateCartUI();
}

function updatePizzaPrice(select) {
  const price = select.value;
  const size = select.options[select.selectedIndex].dataset.size;
  const name = select.dataset.name;
  const card = select.closest(".food-card");

  card.querySelector(".price").innerText = "₹" + price;
  const btn = card.querySelector(".cart-btn");
  btn.setAttribute("onclick", `addToCart('${name} (${size})', ${price})`);
}

function updateCartUI() {
  const container = document.getElementById("cartItemsList");
  container.innerHTML = "";
  let total = 0;
  let itemsCount = 0;

  cart.forEach(item => {
    const itemTotal = item.price * item.qty;
    total += itemTotal;
    itemsCount += item.qty;
    container.innerHTML += `
      <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:14px;">
        <span>${item.name} x ${item.qty}</span>
        <span style="color:#00ff00; font-weight:bold;">₹${itemTotal}</span>
      </div>
    `;
  });

  document.getElementById("cartGrandTotal").textContent = total;
  document.getElementById("barCount").textContent = `${itemsCount} ITEMS | ₹${total}`;

  const bar = document.getElementById("cartBar");
  if (cart.length > 0) bar.classList.add("show");
  else {
    bar.classList.remove("show");
    closeModal('cartModal');
  }
}

async function placeOrder() {
  if (!currentUser) {
    alert("Order place karne ke liye pehle Login karein!");
    closeModal('cartModal');
    openModal('authModal');
    return;
  }

  const address = document.getElementById("deliveryAddress").value.trim();
  if (!address) {
    alert("Delivery address dalna zaroori hai.");
    return;
  }

  const itemsSummary = cart.map(i => `• ${i.name} x${i.qty} - ₹${i.price * i.qty}`).join("\n");
  const grandTotal = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

  // Supabase me order save karein
  await supabaseClient.from('orders').insert([{
    customer_phone: currentUser.phone,
    customer_name: currentUser.name,
    address: address,
    items: itemsSummary,
    total_amount: grandTotal
  }]);

  // WhatsApp par redirect karein
  const msg = `🛒 *NEW ORDER - NIGHT KITCHEN*\n\n${itemsSummary}\n\n💰 *Total:* ₹${grandTotal}\n👤 *Customer:* ${currentUser.name} (${currentUser.phone})\n🏠 *Address:* ${address}`;
  window.open(`https://wa.me/917061632122?text=${encodeURIComponent(msg)}`, "_blank");
}

async function fetchOrderHistory() {
  const container = document.getElementById("historyListContainer");
  container.innerHTML = "Fetching your orders...";

  if (!currentUser) return;

  const { data, error } = await supabaseClient
    .from('orders')
    .select('*')
    .eq('customer_phone', currentUser.phone)
    .order('order_date', { ascending: false });

  if (error || !data || data.length === 0) {
    container.innerHTML = "<p style='color:#aaa;'>Abhi tak aapka koi order record nahi hai.</p>";
    return;
  }

  container.innerHTML = data.map(o => `
    <div class="history-item">
      <div style="display:flex; justify-content:space-between; font-size:12px; color:#888;">
        <span>Order #${o.id}</span>
        <span>${new Date(o.order_date).toLocaleDateString('en-IN', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})}</span>
      </div>
      <div style="font-size:13px; margin:6px 0; white-space:pre-line;">${o.items}</div>
      <div style="text-align:right; color:#00ff00; font-weight:bold;">₹${o.total_amount}</div>
    </div>
  `).join("");
}

function showToast(msg) {
  let toast = document.createElement("div");
  toast.className = "toast";
  toast.innerText = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.classList.add("show"), 30);
  setTimeout(() => {
    toast.classList.remove("show");
    setTimeout(() => toast.remove(), 300);
  }, 1600);
}

function filterCategory(cat, btn) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.food-card').forEach(card => {
    card.style.display = (cat === 'all' || card.getAttribute('data-category') === cat) ? "" : "none";
  });
}

function filterMenu() {
  const q = document.getElementById('menuSearch').value.trim().toUpperCase();
  document.querySelectorAll('.food-card').forEach(card => {
    const title = card.querySelector('h3').textContent || "";
    card.style.display = title.toUpperCase().includes(q) ? "" : "none";
  });
}
</script>
</body>
</html>
